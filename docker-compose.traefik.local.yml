# =============================================================================
# Traefik LOCAL mode overlay (mkcert certificates, ports 8080/8443)
#
# Compose with the base file:
#   docker compose --env-file .env -f docker-compose.prod.yml \
#     -f docker-compose.traefik.local.yml up -d
#
# Prereqs (see docs/production-traefik.md):
#   1. mkcert certificates present in traefik/certs/ (already generated):
#        traefik/certs/childnest-local.pem
#        traefik/certs/childnest-local-key.pem
#   2. Windows hosts file entries for the four childnest.co.uk domains
#      (127.0.0.1) - added manually by the user.
#   3. Docker Engine API bridge for the docker provider (Docker Desktop for
#      Windows cannot bind-mount unix sockets into containers - see
#      traefik/host-services/ for the helper that is tested on this machine).
#
# Resulting local URLs (https, via hosts-file resolution):
#   https://api.childnest.co.uk:8443/
#   https://dashboard.childnest.co.uk:8443/
#   (shop.childnest.co.uk / store-fe.childnest.co.uk route only after the
#    storefront service exists - see docs)
# =============================================================================

services:
  traefik:
    image: traefik:3.7.17          # explicitly pinned; never use `latest`
    restart: unless-stopped
    # Entry points, providers and dashboard settings live in the static file:
    #   traefik/static/local/traefik.yaml
    # (mounted read-only; TLS certs come from the file provider dynamic config
    #  at traefik/dynamic/local/ and traefik/certs/).
    ports:
      # Loopback-bound on purpose: local mode is driven through the
      # hosts-file domains at 127.0.0.1. Nothing else on the host should
      # reach these ports.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./traefik/static/local/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic/local:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    extra_hosts:
      # Docker Desktop (Windows) special host for reaching the engine API
      # bridge (host.docker.internal is also resolved automatically by
      # Docker Desktop, but the explicit entry keeps the file portable to
      # plain Linux Docker, where host-gateway is the mechanism).
      - "host.docker.internal:host-gateway"
    labels:
      # The dashboard route: reachable ONLY via websecure (TLS) on a
      # dedicated hostname, never on a raw published port (api.insecure is
      # false in the static config). Add basic auth here for LAN use.
      traefik.enable: "true"
      traefik.docker.network: saleor-proxy-net
      traefik.http.routers.traefik-dashboard.rule: >-
          Host(`traefik.childnest.co.uk`)
      traefik.http.routers.traefik-dashboard.entrypoints: websecure
      traefik.http.routers.traefik-dashboard.tls: "true"
      traefik.http.routers.traefik-dashboard.service: api@internal
      traefik.http.routers.traefik-dashboard.middlewares: secure-headers
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - saleor-proxy-net

  # ---------------------------------------------------------------------------
  # Saleor API: route api.childnest.co.uk (HTTPS) -> container port 8000
  # ---------------------------------------------------------------------------
  api:
    labels:
      traefik.enable: "true"
      traefik.docker.network: saleor-proxy-net
      traefik.http.routers.saleor-api.rule: Host(`api.childnest.co.uk`)
      traefik.http.routers.saleor-api.entrypoints: websecure
      traefik.http.routers.saleor-api.tls: "true"
      traefik.http.routers.saleor-api.service: saleor-api
      traefik.http.routers.saleor-api.middlewares: secure-headers
      traefik.http.services.saleor-api.loadbalancer.server.port: "8000"
      traefik.http.services.saleor-api.loadbalancer.healthcheck.path: /graphql/
      traefik.http.services.saleor-api.loadbalancer.healthcheck.port: "8000"

  # Dashboard: route dashboard.childnest.co.uk (HTTPS) -> container port 80
  dashboard:
    labels:
      traefik.enable: "true"
      traefik.docker.network: saleor-proxy-net
      traefik.http.routers.saleor-dashboard.rule: >-
          Host(`dashboard.childnest.co.uk`)
      traefik.http.routers.saleor-dashboard.entrypoints: websecure
      traefik.http.routers.saleor-dashboard.tls: "true"
      traefik.http.routers.saleor-dashboard.service: saleor-dashboard
      traefik.http.routers.saleor-dashboard.middlewares: secure-headers
      traefik.http.services.saleor-dashboard.loadbalancer.server.port: "80"

  # ---------------------------------------------------------------------------
  # Storefront routing (PAPER) - prepared but INACTIVE on purpose.
  # The Paper storefront repo (storefront-paper) currently builds its own
  # image (no published tag exists yet). When its image is ready, add a
  # `storefront` service (image: <that tag>) on saleor-proxy-net exposing
  # port 3000, and then UNCOMMENT the routing below (also for
  # store-fe.childnest.co.uk if it turns out to be a distinct service).
  # ---------------------------------------------------------------------------
  # api:
  #   labels: {}   # see docs/production-traefik.md -> "Paper storefront"
  #
  # Example labels for the future `storefront` service:
  #   traefik.enable: "true"
  #   traefik.docker.network: saleor-proxy-net
  #   traefik.http.routers.saleor-storefront.rule: Host(`shop.childnest.co.uk`)
  #   traefik.http.routers.saleor-storefront.entrypoints: websecure
  #   traefik.http.routers.saleor-storefront.tls: "true"
  #   traefik.http.routers.saleor-storefront.service: saleor-storefront
  #   traefik.http.routers.saleor-storefront.middlewares: secure-headers
  #   traefik.http.services.saleor-storefront.loadbalancer.server.port: "3000"

  # ---------------------------------------------------------------------------
  # Local-only conveniences (NOT part of the base production stack):
  # - Jaeger UI + OTLP reachable on loopback only (never public).
  # - Mailpit web UI is left UNPUBLISHED. If you need it temporarily for
  #   checking mail, add:   ports: ["127.0.0.1:8025:8025"]   (remove after).
  # ---------------------------------------------------------------------------
  jaeger:
    ports:
      - "127.0.0.1:16686:16686"   # UI, loopback only
      - "127.0.0.1:4317:4317"     # OTLP/gRPC from host tools, loopback only
      - "127.0.0.1:4318:4318"     # OTLP/HTTP, loopback only
