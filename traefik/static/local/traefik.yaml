# =============================================================================
# Traefik static configuration - LOCAL mode (mkcert, ports 80/443)
#
# Loaded by: docker-compose.traefik.local.yml
# Traefik version pinned in compose: 3.7.17
# =============================================================================

log:
  level: INFO

accessLog: {}

# Dashboard enabled but NOT exposed on a raw port (insecure: false).
# It is only reachable through the router defined in the compose overlay
# (Host(`traefik.childnest.co.uk`) on websecure).
api:
  dashboard: true
  insecure: false

entryPoints:
  # The api's default "traefik" entry point would also claim port 80 and
  # collide with `web` below - disable it; the dashboard is routed manually.
  traefik:
    address: ""
  web:
    address: :80
    http:
      # Redirect ALL plain HTTP to HTTPS across the board.
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443

providers:
  # Dynamic config: TLS certificate (mkcert, all four domains) plus the
  # secure-headers middleware used by the routers in compose overlays.
  file:
    directory: /etc/traefik/dynamic
  # Docker provider.
  #
  # NOTE (Docker Desktop for Windows): unix sockets CANNOT be bind-mounted
  # into containers - Desktop materialises them as regular files (verified
  # on this host). So locally we use the Docker Engine API over TCP from a
  # helper service started in the WSL distro (see traefik/host-services/);
  # this is bound to 127.0.0.1 inside that distro only.
  #
  # On a plain Linux host (e.g. after extracting Traefik into its own repo)
  # replace with:
  #   endpoint: "unix:///var/run/docker.sock"
  # and mount the socket :ro in the compose file.
  docker:
    endpoint: "http://host.docker.internal:23750"
    # Containers are hidden from Traefik unless they explicitly opt in with
    # traefik.enable=true (set per-service in the overlays).
    exposedByDefault: false
    # Route to backends on the dedicated proxy network.
    network: saleor-proxy-net
