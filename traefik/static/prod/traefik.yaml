# =============================================================================
# Traefik static configuration - PRODUCTION mode (Let's Encrypt, 80/443)
#
# Loaded by: docker-compose.traefik.prod.yml
#
# DO NOT USE THIS FILE FOR LOCAL VALIDATION. It declares the production
# Let's Encrypt ACME server and public ports; it is only correct on a host
# with public DNS for the childnest.co.uk domains. Local validation uses
# traefik/static/local/traefik.yaml.
#
# The ACME email is intentionally NOT in this file: the compose overlay
# passes it as --providers.acme.email from the .env (ACME_EMAIL).
# =============================================================================

log:
  level: INFO

accessLog: {}

api:
  dashboard: true
  insecure: false

entryPoints:
  traefik:
    address: ""   # disable default dashboard entry point (see local file)
  web:
    address: :80
    http:
      # Plain HTTP -> HTTPS for everything. The ACME HTTP-01 challenge router
      # (auto-created by Traefik on this entry point) has higher routing
      # priority, so /.well-known/acme-challenge/ requests are never
      # redirected and let validation succeed.
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443

providers:
  file:
    directory: /etc/traefik/dynamic
  docker:
    # Production: real unix socket on a Linux host, mounted :ro in compose.
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: saleor-proxy-net
  # pi-lens-ignore: yaml-schema
  # (LSP validates with a Traefik v2 schema; the pinned traefik:3.7.17
  #  uses providers.acme - v2 put it top-level. See docs §7.)
  # pi-lens-ignore: yaml-schema
  acme:
    # Email supplied via CLI flag (see compose overlay).
    # Persistent storage (named volume `traefik-le` in compose).
    storage: /letsencrypt/acme.json
    # PRODUCTION Let's Encrypt endpoint. For a future test run against a
    # domain you control you may temporarily switch to
    # https://acme-staging-v02.api.letsencrypt.org/directory - the staging
    # certs are not trusted, which makes mistakes safe.
    # Do not point local validation at either endpoint.
    caServer: "https://acme-v02.api.letsencrypt.org/directory"
    httpChallenge:
      entryPoint: web
    # Explicit requested certificates. ONLY the two currently existing
    # storefront-free services are requested: api + dashboard. Storefront
    # domains are intentionally NOT requested so Traefik does not try to
    # issue certs for services that don't exist yet (ACME would still work
    # via HTTP-01 on the web entrypoint, but we keep requests minimal and
    # predictable). Add shop./store-fe. here when those services land.
    domains:
      - main: api.childnest.co.uk
      - main: dashboard.childnest.co.uk
