services:
  api:
    image: ghcr.io/saleor/saleor:3.23
    # host port 8000 is already used by medusa_storefront, so map to 8001
    ports:
      - 8001:8000
    restart: unless-stopped
    networks:
      - saleor-backend-tier
      # externally managed PostgreSQL 18 lives on postgres-net (hostname: postgres)
      - postgres-net
    stdin_open: true
    tty: true
    depends_on:
      - cache
      - jaeger
    volumes:
      # shared volume between worker and api for media
      - saleor-media:/app/media
    env_file:
      - common.env
      - backend.env
    environment:
      - DASHBOARD_URL=http://localhost:9001/
      - ALLOWED_HOSTS=localhost,127.0.0.1,api

  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:3.23
    # host port 9000 is already used by medusa_backend, so map to 9001
    ports:
      - 9001:80
    restart: unless-stopped
    environment:
      # injected by the image's entrypoint into the static bundle at startup;
      # default points to port 8000, which is taken by another service here
      - API_URL=http://localhost:8001/graphql/
    # attach to the existing backend network so Compose does not create a
    # project-prefixed default network
    networks:
      - saleor-backend-tier

  # NOTE: the upstream `db` service (postgres:15-alpine) was removed on purpose.
  # PostgreSQL 18 is managed externally (container: infrastructure-postgres-1,
  # database: saleor) and is reached via the external network postgres-net.

  cache:
    image: valkey/valkey:8.1-alpine
    # no published port: host 6379 is used by medusa_redis; cache is only
    # accessed by api/worker over the saleor-backend-tier network
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-cache:/data

  worker:
    image: ghcr.io/saleor/saleor:3.23
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    restart: unless-stopped
    networks:
      - saleor-backend-tier
      # worker runs Celery tasks that need the externally managed PostgreSQL
      - postgres-net
    env_file:
      - common.env
      - backend.env
    depends_on:
      - cache
      - mailpit
    volumes:
      # shared volume between worker and api for media
      - saleor-media:/app/media

  jaeger:
    image: jaegertracing/jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - type: tmpfs
        target: /tmp

  mailpit:
    image: axllent/mailpit
    ports:
      - 1025:1025 # smtp server
      - 8025:8025 # web ui. Visit http://localhost:8025/ to check emails
    restart: unless-stopped
    networks:
      - saleor-backend-tier

volumes:
  saleor-cache:
    driver: local
  saleor-media:

networks:
  saleor-backend-tier:
    external: true
  postgres-net:
    external: true
