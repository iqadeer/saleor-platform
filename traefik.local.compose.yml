
services:
  traefik:
    image: traefik:v3.7.17
    container_name: traefik
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
      - "8081:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - saleor-proxy-net

networks:
  saleor-proxy-net:
    external: true
